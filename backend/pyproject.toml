[project]
name = "campusflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "ortools>=9.10",
    "python-dateutil>=2.9",
    "dateparser>=1.2",
    "rank_bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "google-genai>=1.0",
    "PyJWT>=2.9",
    "bcrypt>=4.1",
    "reportlab>=4.2",
    "qrcode[pil]>=7.4",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
