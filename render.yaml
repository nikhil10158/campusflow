services:
  - type: web
    name: campusflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASS_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000
      - key: FRONTEND_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: SOLVER_WORKERS
        value: "2"
      - key: SOLVER_TIME_LIMIT_S
        value: "5"
      - key: AUTO_SEED_ON_EMPTY
        value: "true"

databases:
  - name: campusflow-db
    plan: free
