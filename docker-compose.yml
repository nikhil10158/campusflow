services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/campusflow.db
      FRONTEND_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
    ports:
      - "8000:8000"
    volumes:
      - campusflow-data:/data

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm ci && npm run build && npm run start"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  campusflow-data:
